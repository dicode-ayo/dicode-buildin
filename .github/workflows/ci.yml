name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3

      - run: deno lint

      - run: deno fmt --check

  test-tasks:
    name: Test tasks (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3

      - name: Run Deno unit tests
        run: deno test --allow-all --config=deno.json './**/task.test.ts' './taskset.test.ts'

  test-daemon:
    name: Load and test via the dicode daemon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DICODE_DATA_DIR: /tmp/dicode-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3

      # The daemon is the authority on whether a task.yaml is valid — it runs
      # the strict validator this repo has no Go to call directly.
      - name: Install the dicode binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo dicode-ayo/dicode-core --json tagName --jq .tagName)
          gh release download "$tag" --repo dicode-ayo/dicode-core \
            --pattern '*-linux-amd64.tar.gz' --output /tmp/dicode.tar.gz
          tar -xzf /tmp/dicode.tar.gz -C /tmp
          install -m755 "$(find /tmp -maxdepth 2 -name dicode -type f | head -1)" ./dicode
          ./dicode version

      - name: Verify deno.lock is up to date
        run: ./dicode deno relock --check .

      - name: Start the daemon and assert the taskset contract
        run: |
          set -euo pipefail
          mkdir -p "$DICODE_DATA_DIR"

          cat > "$DICODE_DATA_DIR/dicode-ci.yaml" <<SPECEOF
          data_dir: $DICODE_DATA_DIR
          database:
            path: \${DATADIR}/data.db
            type: sqlite
          log_level: info
          server:
            port: 18765
            auth: false
            mcp: false
            tray: false
          relay:
            enabled: false
          spec:
            entries:
              buildin:
                ref:
                  path: $GITHUB_WORKSPACE/taskset.yaml
                  watch: false
          SPECEOF

          ./dicode daemon --config "$DICODE_DATA_DIR/dicode-ci.yaml" \
            > "$DICODE_DATA_DIR/daemon.log" 2>&1 &
          DAEMON_PID=$!
          trap "kill $DAEMON_PID 2>/dev/null || true" EXIT

          # Poll the IPC socket: `dicode task test` talks over IPC, and the
          # HTTP registry the assertion reads comes up alongside it.
          for i in $(seq 1 60); do
            test -S "$DICODE_DATA_DIR/daemon.sock" && break
            if [ "$i" -eq 60 ]; then
              echo "Daemon did not become ready in 30 s"
              cat "$DICODE_DATA_DIR/daemon.log"
              exit 1
            fi
            sleep 0.5
          done

          deno run --allow-read --allow-net scripts/assert-taskset.ts \
            http://127.0.0.1:18765

          # One run per task directory that ships a task.test.ts. template/
          # and write-local/ are pipeline stages with no taskset entry, so they
          # are only reachable from the deno test job above.
          failed=0
          for id in $(deno run --allow-read scripts/tasks-with-tests.ts); do
            echo "::group::dicode task test $id"
            name=$(echo "$id" | tr '/' '-')
            if ! DICODE_DATA_DIR="$DICODE_DATA_DIR" ./dicode task test "$id" \
              --format=junit > "$RUNNER_TEMP/$name.xml"; then
              echo "::error::$id failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-test-results
          path: ${{ runner.temp }}/*.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Upload daemon log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-log
          path: ${{ env.DICODE_DATA_DIR }}/daemon.log
          retention-days: 3
