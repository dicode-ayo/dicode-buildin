apiVersion: dicode/v1
kind: Task
name: "System Tray"
description: >
  System tray icon daemon for dicode. Replaces the CGO pkg/tray/ implementation
  in dicode-core, removing the CGO build dependency from dicode daemon entirely.
  Uses Option A from issue #59: deno.land/x/systray bundles a pre-compiled
  native helper that communicates over stdin/stdout — no CGO, no GTK.
  See: https://github.com/dicode-ayo/dicode-core/issues/59
runtime: deno

permissions:
  env:
    - DICODE_PORT
  # Unrestricted because the systray helper binary runs from a dynamic temp
  # path; the task also spawns xdg-open (Open Dashboard) and gdbus (SNI-host
  # probe, see sni.ts). A future least-privilege pass must keep those covered.
  run:
    - "*"
  fs:
    - path: ~/.cache
      permission: rw
  # systray-portable binary download: github.com redirects release assets
  # to *.githubusercontent.com hosts.
  net:
    - github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com

params:
  tray_version:
    description: Systray portable binary release tag (dicode-ayo/systray-portable)
    default: "v0.3.0"
  left_click:
    description: >
      What a click on the icon itself does: "menu" opens the tray menu,
      "dashboard" opens the dashboard. "dashboard" makes the tray advertise
      ItemIsMenu=false, so a host that honors that hint stops opening the menu
      on left click — the menu stays reachable on right click. Choose it on a
      bar that renders XEmbed only (polybar, i3bar), where a left click
      otherwise does nothing at all.
    default: "menu"

trigger:
  daemon: true
  restart: always
