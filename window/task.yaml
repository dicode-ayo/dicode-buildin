apiVersion: dicode/v1
kind: Task
name: "Window"
description: |
  Opens another task's own webhook UI in a chrome-less native window, then
  exits. The window renders /hooks/<target> — the target task's existing UI,
  session-gated by its own trigger.auth — so a windowed app needs no new page
  anywhere: a task that wants a window ships an index.html and this supplies
  the frame.

  Not a host and not a runner. It resolves a URL, builds an argv, spawns a
  browser detached and returns; nothing about the window is dicode's to manage
  after launch. Closing it is a browser event dicode never sees.

  Geometry and decoration are the window manager's: the run returns the i3 and
  picom rules for the WM_CLASS instance it just produced, to paste into a
  config once per windowed app.
runtime: deno

trigger:
  manual: true

params:
  target:
    type: string
    required: true
    description: "Task whose UI to show. Namespaced id (buildin/webui) or a bare name when unambiguous."
  host_binary:
    type: string
    default: "google-chrome"
    description: "Chromium-family binary that owns the window."
  port:
    type: string
    default: "8080"
    description: "Port the daemon's web server listens on. No env var carries it, so a non-default server.port must be repeated here."
  width:
    type: string
    default: ""
    description: "Window width in pixels. Emitted as an i3 `resize set` rule; needs height too."
  height:
    type: string
    default: ""
    description: "Window height in pixels. Emitted as an i3 `resize set` rule; needs width too."
  alignment:
    type: string
    default: ""
    description: "`center` maps to i3's `move position center`. Empty leaves placement to the WM."
  opacity:
    type: string
    default: ""
    description: "0-100. Emits a picom opacity-rule keyed on the instance. Empty emits no picom rule."
  sticky:
    type: string
    default: "false"
    description: "Add `sticky enable` to the i3 rule, keeping the window across workspace switches."
  profile_dir:
    type: string
    default: ""
    description: "Browser profile directory. Empty uses the shared one under the dicode data dir."

permissions:
  # setsid is what Deno actually launches, and it will exec whatever it is
  # handed — so this grant is as wide as the host binary the params name, and
  # listing the browser alongside it documents intent rather than narrowing
  # anything. The double fork is not optional: Deno kills a spawned child when
  # the run exits, which would close the window the first launch just opened.
  run:
    - setsid
    - google-chrome
  # DISPLAY and XAUTHORITY are not on the daemon's host-passthrough allowlist
  # (pkg/runtime/subprocenv.go), and a task subprocess inherits nothing else.
  # Without them the browser has no X server to draw on and exits immediately,
  # taking the window with it — silently, because the spawn is detached.
  env:
    - DISPLAY
    - XAUTHORITY
    - DICODE_DATADIR
    - HOME
  dicode:
    list_tasks: true

timeout: 30s
